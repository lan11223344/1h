# GitHub Actions → GitHub Pages 自动部署
#
# 触发条件：push 到 main 分支，或手动在 Actions 页面点 Run workflow
# 前置设置：仓库 Settings → Pages → Source 选择 "GitHub Actions"
#
# 注意：如果部署到 https://<用户名>.github.io/<仓库名>/ 这样的子路径，
# 必须给构建注入 BASE_PATH=/<仓库名>/ ，否则 CSS/JS 会 404。
# 本文件已自动处理；若使用自定义域名或用户主页仓库，把 BASE_PATH 留空即可。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          # 用户主页仓库（<用户名>.github.io）或自定义域名时留空
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
