[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA 回退：所有未匹配到静态文件的路径都交给 index.html，
# 否则直接访问 /work 这类子路径会 404。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 带 hash 的静态资源可以长缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
