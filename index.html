    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        },
        "knowsAbout": [
          "HTML/CSS",
          "JavaScript",
          "React",
          "TypeScript",
          "Tailwind CSS"
        ]
      }
    </script>
  </head>
